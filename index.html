<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kijewo – próba terenu</title>
<style>
  html, body { margin: 0; height: 100%; background: #9fb6c9; overflow: hidden; font: 14px system-ui, sans-serif; }
  #hud { position: fixed; left: 12px; top: 12px; background: rgba(0,0,0,.65); color: #fff; padding: 10px 12px; border-radius: 6px; max-width: 380px; }
  #hud b { color: #ffd34d; }
  #hud button { margin: 4px 4px 0 0; }
  #info { position: fixed; right: 12px; bottom: 12px; background: rgba(0,0,0,.65); color: #fff; padding: 6px 10px; border-radius: 6px; font-family: monospace; }
  #load { position: fixed; inset: 0; display: grid; place-items: center; color: #fff; background: #222; font-size: 18px; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="load">Wczytuję teren…</div>
<div id="hud">
  <b>Próba terenu: strzelnica Kijewo</b><br>
  Widok:
  <button data-view="firing_point">stanowisko (leżąc)</button>
  <button data-view="stand">trybuna</button>
  <button data-view="fly">swobodny lot</button><br>
  Przeciągnij myszą, żeby się rozejrzeć. Kółko myszy przybliża (1–12×).<br>
  Swobodny lot: W/S/A/D, Q/E w górę i w dół, Shift przyspiesza.<br>
  Godzina: <input id="hour" type="range" min="0" max="24" step="0.25" value="13" style="width:200px;vertical-align:middle"> <span id="hourv">13:00</span><br>
  <button id="playScene" style="margin:6px 0">▶ Scena: podejście, obserwacja, strzał</button><br>
  <button id="playSling" style="margin:0 0 6px">▶ Scena testowa: marsz z Grotem na pasie (klawisze 1–4: kamera)</button><br>
  <button id="playDemo1" style="margin:0 0 6px">▶ Scena pokazowa 1: strzelanie z SpKW/Z</button><br>
  Wiatr: <input id="wind" type="range" min="0" max="12" step="0.5" value="4" style="width:120px;vertical-align:middle"> <span id="windv">4 m/s</span>
</div>
<div id="info"></div>
<script type="module">
import * as THREE from "three";
import { Sky } from "three/addons/objects/Sky.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import * as SkeletonUtils from "three/addons/utils/SkeletonUtils.js";

const T = "terrain/";
const LITE = new URLSearchParams(location.search).has("lite");   // headless checks: less grass, small shadows
const meta = await (await fetch(T + "meta.json")).json();
const [GW, GH] = meta.grid, CELL = meta.cell_m, NEAR = meta.near;
const heights = new Uint16Array(await (await fetch(T + "height_2m.u16")).arrayBuffer());
const nearH = new Uint16Array(await (await fetch(T + "height_near_1m.u16")).arrayBuffer());
function sample(arr, w, h, cell, x, z) {
  const gx = Math.min(Math.max(x / cell - 0.5, 0), w - 1.001), gz = Math.min(Math.max(z / cell - 0.5, 0), h - 1.001);
  const x0 = Math.floor(gx), z0 = Math.floor(gz), fx = gx - x0, fz = gz - z0, i = z0 * w + x0;
  return ((arr[i] * (1 - fx) + arr[i + 1] * fx) * (1 - fz) + (arr[i + w] * (1 - fx) + arr[i + w + 1] * fx) * fz) / 100;
}
const inNear = (x, z) => x > NEAR.x0 + 1 && x < NEAR.x0 + NEAR.size - 1 && z > NEAR.z0 + 1 && z < NEAR.z0 + NEAR.size - 1;
const hAt = (x, z) => inNear(x, z) ? sample(nearH, NEAR.grid, NEAR.grid, 1, x - NEAR.x0, z - NEAR.z0) : sample(heights, GW, GH, CELL, x, z);

// The stand's concrete body shows up in the DTM as a mound: flatten it inside the outline + 1.2 m.
function inPoly(x, z, P) { let c = false; for (let i = 0, j = P.length - 1; i < P.length; j = i++) { const [xi, zi] = P[i], [xj, zj] = P[j]; if ((zi > z) !== (zj > z) && x < (xj - xi) * (z - zi) / (zj - zi) + xi) c = !c; } return c; }
for (const b of meta.buildings_osm || []) {
  if (b.deck - b.ground < 1.5) continue;
  const cx = b.poly.reduce((a, p) => a + p[0], 0) / b.poly.length, cz = b.poly.reduce((a, p) => a + p[1], 0) / b.poly.length;
  const P = b.poly.map(([x, z]) => { const dx = x - cx, dz = z - cz, d = Math.hypot(dx, dz); return [x + dx / d * 1.7, z + dz / d * 1.7]; });
  const g100 = Math.round((b.ground + 0.05) * 100);
  for (let r = 0; r < NEAR.grid; r++) for (let c = 0; c < NEAR.grid; c++) if (inPoly(NEAR.x0 + c + 0.5, NEAR.z0 + r + 0.5, P)) nearH[r * NEAR.grid + c] = Math.min(nearH[r * NEAR.grid + c], g100);
  for (let r = 0; r < GH; r++) for (let c = 0; c < GW; c++) if (inPoly((c + 0.5) * CELL, (r + 0.5) * CELL, P)) heights[r * GW + c] = Math.min(heights[r * GW + c], g100);
}

const renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
renderer.setPixelRatio(LITE ? 0.3 : Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = !LITE;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.55;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xb8c8d8, 0.00028);
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.05, 20000);

const sky = new Sky(); sky.scale.setScalar(15000); scene.add(sky);
sky.material.uniforms.turbidity.value = 6; sky.material.uniforms.rayleigh.value = 1.6;
sky.material.uniforms.mieCoefficient.value = 0.004; sky.material.uniforms.mieDirectionalG.value = 0.8;

const hemi = new THREE.HemisphereLight(0xcfe0ff, 0x5a5236, 1.0);
const sun = new THREE.DirectionalLight(0xfff1d6, 3.0);
sun.castShadow = true;
sun.shadow.mapSize.set(LITE ? 512 : 4096, LITE ? 512 : 4096);
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.6;
Object.assign(sun.shadow.camera, { left: -150, right: 150, top: 150, bottom: -150, near: 1, far: 4000 });
scene.add(hemi, sun, sun.target);

// ---------- procedural detail textures (canvas) ----------
function noiseCanvas(size, paint) { const c = document.createElement("canvas"); c.width = c.height = size; paint(c.getContext("2d"), size); return c; }
let rs = 12345; const rnd = () => (rs = (rs * 16807) % 2147483647) / 2147483647;
const detailTex = new THREE.CanvasTexture(noiseCanvas(512, (g, s) => {   // grass/soil micro detail, neutral mean ~0.5
  g.fillStyle = "#808080"; g.fillRect(0, 0, s, s);
  for (let i = 0; i < 26000; i++) {
    const x = rnd() * s, y = rnd() * s, l = 2 + rnd() * 7, a = -1.9 + rnd() * 0.8, v = 90 + rnd() * 90;
    g.strokeStyle = `rgba(${v},${v},${v},0.55)`; g.lineWidth = 0.6 + rnd();
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke();
  }
  for (let i = 0; i < 1800; i++) { const v = 60 + rnd() * 140; g.fillStyle = `rgba(${v},${v},${v},0.35)`; g.beginPath(); g.arc(rnd() * s, rnd() * s, 0.5 + rnd() * 2.5, 0, 7); g.fill(); }
}));
detailTex.wrapS = detailTex.wrapT = THREE.RepeatWrapping; detailTex.colorSpace = THREE.NoColorSpace;
detailTex.anisotropy = 8;

// close-range ground (author, 18 XI: more detail within ~20 m): a colour texture of sandy soil with pebbles, dark
// patches and dry/green blades, sampled at two scales and normalised by its own mean colour, so the orthophoto still
// sets the overall colour and the far terrain joins without a seam
const NEAR_GROUND = (() => {
  const s = 1024, c = noiseCanvas(s, (g) => {
    g.fillStyle = "#8c7d61"; g.fillRect(0, 0, s, s);
    for (let i = 0; i < 9000; i++) { const v = rnd(), r = 2 + rnd() * 14; g.fillStyle = v < 0.5 ? `rgba(70,58,40,${0.06 + rnd() * 0.1})` : `rgba(170,155,120,${0.05 + rnd() * 0.1})`; g.beginPath(); g.arc(rnd() * s, rnd() * s, r, 0, 7); g.fill(); }
    for (let i = 0; i < 6000; i++) { const v = 90 + rnd() * 110, x = rnd() * s, y = rnd() * s, r = 0.6 + rnd() * 2.2;          // pebbles with a light top
      g.fillStyle = `rgb(${v},${v * 0.95},${v * 0.85})`; g.beginPath(); g.ellipse(x, y, r * 1.2, r, rnd() * 3, 0, 7); g.fill();
      g.fillStyle = "rgba(255,250,235,0.35)"; g.beginPath(); g.arc(x - r * 0.3, y - r * 0.3, r * 0.45, 0, 7); g.fill(); }
    for (let i = 0; i < 16000; i++) { const x = rnd() * s, y = rnd() * s, l = 3 + rnd() * 12, a = rnd() * 6.28, dry = rnd() < 0.6;   // blades
      g.strokeStyle = dry ? `rgba(${150 + rnd() * 60},${135 + rnd() * 50},${80 + rnd() * 40},0.7)` : `rgba(${60 + rnd() * 40},${90 + rnd() * 50},${40 + rnd() * 25},0.7)`;
      g.lineWidth = 0.7 + rnd() * 0.9; g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke(); }
  });
  const d = c.getContext("2d").getImageData(0, 0, s, s).data; let m = [0, 0, 0];
  for (let i = 0; i < d.length; i += 4) { m[0] += d[i]; m[1] += d[i + 1]; m[2] += d[i + 2]; }
  const n = d.length / 4, t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.NoColorSpace; t.anisotropy = 16; t.generateMipmaps = true;
  return { tex: t, mean: new THREE.Vector3(m[0] / n / 255, m[1] / n / 255, m[2] / n / 255) };
})();
function terrainMaterial(map) {
  const mat = new THREE.MeshLambertMaterial({ map });
  mat.onBeforeCompile = sh => {
    sh.uniforms.detail = { value: detailTex }; sh.uniforms.nearTex = { value: NEAR_GROUND.tex }; sh.uniforms.nearMean = { value: NEAR_GROUND.mean };
    sh.vertexShader = sh.vertexShader.replace("#include <common>", "#include <common>\nvarying vec3 vWorld;")
      .replace("#include <worldpos_vertex>", "#include <worldpos_vertex>\nvWorld = (modelMatrix * vec4(transformed,1.0)).xyz;");
    sh.fragmentShader = sh.fragmentShader.replace("#include <common>", "#include <common>\nuniform sampler2D detail; uniform sampler2D nearTex; uniform vec3 nearMean; varying vec3 vWorld;")
      .replace("#include <map_fragment>", `#include <map_fragment>
        float dist = length(vWorld - cameraPosition);
        float d1 = texture2D(detail, vWorld.xz / 1.7).r, d2 = texture2D(detail, vWorld.xz / 9.0).g;
        float fade = 1.0 - smoothstep(25.0, 260.0, dist);
        diffuseColor.rgb *= mix(1.0, (d1 * 0.65 + d2 * 0.35) * 2.0, 0.85 * fade);
        diffuseColor.rgb *= mix(1.0, 0.78 + 0.44 * d2, 0.5);
        float nearK = 1.0 - smoothstep(12.0, 24.0, dist);
        if (nearK > 0.0) {
          vec3 n1 = texture2D(nearTex, vWorld.xz / 1.5).rgb, n2 = texture2D(nearTex, vWorld.xz / 0.42 + 0.37).rgb;
          vec3 nd = (n1 * 0.65 + n2 * 0.35) / nearMean;
          diffuseColor.rgb = mix(diffuseColor.rgb, diffuseColor.rgb * nd, 0.9 * nearK);
        }`);
  };
  return mat;
}
const texLoader = new THREE.TextureLoader();
async function tex(url) { const t = await texLoader.loadAsync(url); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = renderer.capabilities.getMaxAnisotropy(); return t; }

// ---------- terrain: far (2 m) + near (1 m, 0.25 m texture) ----------
function gridMesh(arr, w, h, cell, x0, z0) {
  const geo = new THREE.PlaneGeometry((w - 1) * cell, (h - 1) * cell, w - 1, h - 1);
  geo.rotateX(-Math.PI / 2);
  geo.translate(x0 + (w - 1) * cell / 2 + cell / 2, 0, z0 + (h - 1) * cell / 2 + cell / 2);
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) p.setY(i, arr[i] / 100);
  geo.computeVertexNormals();
  return geo;
}
const farMat = terrainMaterial(await tex(T + "orto.jpg"));
farMat.polygonOffset = true; farMat.polygonOffsetFactor = 6; farMat.polygonOffsetUnits = 6;
const far = new THREE.Mesh(gridMesh(heights, GW, GH, CELL, 0, 0), farMat);
far.position.y = -0.25; far.receiveShadow = true;
const near = new THREE.Mesh(gridMesh(nearH, NEAR.grid, NEAR.grid, 1, NEAR.x0, NEAR.z0), terrainMaterial(await tex(T + "orto_near.jpg")));
near.receiveShadow = true;
scene.add(far, near);

// orthophoto pixels for colour sampling (grass)
const nearImg = await new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = T + "orto_near.jpg"; });
const oc = document.createElement("canvas"); oc.width = 800; oc.height = 800;
const og = oc.getContext("2d", { willReadFrequently: true }); og.drawImage(nearImg, 0, 0, 800, 800);
const opx = og.getImageData(0, 0, 800, 800).data;
const orthoRGB = (x, z) => { const i = (Math.floor(z - NEAR.z0) * 800 + Math.floor(x - NEAR.x0)) * 4; return [opx[i], opx[i + 1], opx[i + 2]]; };

// ---------- wind ----------
const windU = { value: 4 }, timeU = { value: 0 };
const windDir = new THREE.Vector2(0.8, 0.6).normalize();

// ---------- grass: instanced blade clusters around the camera ----------
const bladeTex = new THREE.CanvasTexture(noiseCanvas(256, (g, s) => {
  g.fillStyle = "#000"; g.fillRect(0, 0, s, s);
  for (let i = 0; i < 46; i++) {
    const x = s * (0.1 + 0.8 * rnd()), h = s * (0.45 + 0.55 * rnd()), lean = (rnd() - 0.5) * s * 0.25, w = 2 + rnd() * 4;
    g.fillStyle = "#fff";
    g.beginPath(); g.moveTo(x - w, s); g.quadraticCurveTo(x + lean * 0.3, s - h * 0.6, x + lean, s - h); g.quadraticCurveTo(x + lean * 0.3 + 1, s - h * 0.6, x + w, s); g.fill();
  }
}));
bladeTex.colorSpace = THREE.NoColorSpace;
const tuft = new THREE.BufferGeometry();
{ // three crossed quads, 1 x 1, base at y=0
  const pos = [], uv = [], idx = [];
  for (let k = 0; k < 3; k++) {
    const a = k * Math.PI / 3, cx = Math.cos(a) * 0.5, cz = Math.sin(a) * 0.5, b = pos.length / 3;
    pos.push(-cx, 0, -cz, cx, 0, cz, cx, 1, cz, -cx, 1, -cz); uv.push(0, 0, 1, 0, 1, 1, 0, 1);
    idx.push(b, b + 1, b + 2, b, b + 2, b + 3);
  }
  tuft.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3)); tuft.setAttribute("uv", new THREE.Float32BufferAttribute(uv, 2)); tuft.setIndex(idx);
  tuft.setAttribute("normal", new THREE.Float32BufferAttribute(new Array(pos.length / 3).fill([0, 1, 0]).flat(), 3));
}
const grassMat = new THREE.MeshLambertMaterial({ alphaMap: bladeTex, alphaTest: 0.4, side: THREE.DoubleSide });
grassMat.onBeforeCompile = sh => {
  sh.uniforms.wind = windU; sh.uniforms.time = timeU;
  sh.vertexShader = sh.vertexShader.replace("#include <common>", "#include <common>\nuniform float wind; uniform float time;")
    .replace("#include <begin_vertex>", `#include <begin_vertex>
      vec4 ip = instanceMatrix * vec4(0.0,0.0,0.0,1.0);
      float sway = (0.04 + 0.03 * wind) * (sin(time * (1.3 + 0.15 * wind) + ip.x * 0.35 + ip.z * 0.21) + 0.6) * position.y * position.y;
      transformed.x += sway * ${windDir.x.toFixed(3)} * 3.0; transformed.z += sway * ${windDir.y.toFixed(3)} * 3.0;`);
  sh.fragmentShader = sh.fragmentShader.replace("#include <alphamap_fragment>", "#include <alphamap_fragment>\n diffuseColor.rgb *= 0.65 + 0.5 * vAlphaMapUv.y;")
    .replace("#include <normal_fragment_begin>", "#include <normal_fragment_begin>\n normal = normalize((viewMatrix * vec4(0.0, 1.0, 0.0, 0.0)).xyz);");   // light blades like the ground, both sides
};
const GRASS_N = LITE ? 8000 : 140000, GRASS_R = 70;
const grass = new THREE.InstancedMesh(tuft, grassMat, GRASS_N);
grass.frustumCulled = false;
scene.add(grass);
const grassCenter = new THREE.Vector2(1e9, 1e9);
function placeGrass(cx, cz) {
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), p = new THREE.Vector3(), c = new THREE.Color();
  let n = 0;
  for (let i = 0; i < GRASS_N * 3 && n < GRASS_N; i++) {
    const r = GRASS_R * Math.pow(rnd(), 0.7), a = rnd() * 6.283;
    const x = cx + Math.cos(a) * r, z = cz + Math.sin(a) * r;
    if (!inNear(x, z)) continue;
    if (Math.hypot(x - meta.positions.firing_point[0], z - meta.positions.firing_point[2]) < 55) continue;   // mown firing point (author, 16 XI)
    const [R, G, B] = orthoRGB(x, z);
    const bright = (R + G + B) / 3;
    if (bright > 150 || (bright > 125 && rnd() < 0.7)) continue;      // roads, sand
    const h = 0.25 + rnd() * 0.45;
    q.setFromAxisAngle(THREE.Object3D.DEFAULT_UP, rnd() * 6.28);
    m.compose(p.set(x, hAt(x, z) - 0.03, z), q, s.set(0.35 + rnd() * 0.3, h, 0.35 + rnd() * 0.3));
    grass.setMatrixAt(n, m);
    c.setRGB(R / 255 * 1.05, G / 255 * 1.1, B / 255 * 0.9, THREE.SRGBColorSpace);
    grass.setColorAt(n++, c);
  }
  grass.count = n; grass.instanceMatrix.needsUpdate = true; if (grass.instanceColor) grass.instanceColor.needsUpdate = true;
  grassCenter.set(cx, cz);
}

// ---------- trees: pines from canopy height ----------
const tr = new Float32Array(await (await fetch(T + "trees.f32")).arrayBuffer());
const nTrees = tr.length / 4;
const needleTex = new THREE.CanvasTexture(noiseCanvas(256, (g, s) => {
  g.fillStyle = "#777"; g.fillRect(0, 0, s, s);
  for (let i = 0; i < 9000; i++) { const v = 60 + rnd() * 160; g.fillStyle = `rgb(${v},${v},${v})`; g.fillRect(rnd() * s, rnd() * s, 1 + rnd() * 3, 1 + rnd() * 2); }
}));
needleTex.wrapS = needleTex.wrapT = THREE.RepeatWrapping;
function crownGeometry() {        // irregular blob of a Scots pine crown, height 1, radius ~1
  const g = new THREE.IcosahedronGeometry(1, 3), p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    const n = 0.75 + 0.35 * Math.sin(x * 5.1 + y * 3.7) * Math.cos(z * 4.3 - y * 2.9) + 0.15 * Math.sin(x * 13 + z * 11);
    p.setXYZ(i, x * n, (y * 0.5 + 0.5) * (0.85 + 0.25 * n), z * n);
  }
  g.computeVertexNormals(); return g;
}
const crowns = new THREE.InstancedMesh(crownGeometry(), new THREE.MeshLambertMaterial({ map: needleTex }), nTrees);
const trunkGeo = new THREE.CylinderGeometry(0.1, 0.17, 1, 6); trunkGeo.translate(0, 0.5, 0);
const trunks = new THREE.InstancedMesh(trunkGeo, new THREE.MeshLambertMaterial({ color: 0x6e5444 }), nTrees);
{
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), p = new THREE.Vector3(), col = new THREE.Color();
  for (let i = 0; i < nTrees; i++) {
    const x = tr[i * 4], z = tr[i * 4 + 1], h = tr[i * 4 + 3], g = hAt(x, z);
    const young = h < 7;
    const crownH = young ? h * 0.8 : h * (0.32 + 0.14 * rnd()), crownR = young ? h * 0.28 : Math.max(1.2, h * (0.13 + 0.06 * rnd()));
    q.setFromEuler(new THREE.Euler((rnd() - 0.5) * 0.12, rnd() * 6.28, (rnd() - 0.5) * 0.12));
    m.compose(p.set(x, g + h - crownH, z), q, s.set(crownR, crownH, crownR * (0.8 + 0.4 * rnd()))); crowns.setMatrixAt(i, m);
    crowns.setColorAt(i, col.setHSL(0.24 + 0.06 * rnd(), 0.30 + 0.1 * rnd(), 0.24 + 0.08 * rnd(), THREE.SRGBColorSpace));
    m.compose(p.set(x, g - 0.3, z), q, s.set(0.6 + h / 25, h - crownH * 0.6 + 0.3, 0.6 + h / 25)); trunks.setMatrixAt(i, m);
  }
}
crowns.castShadow = trunks.castShadow = crowns.receiveShadow = true;
scene.add(crowns, trunks);

// ---------- buildings ----------
const plaster = new THREE.CanvasTexture(noiseCanvas(256, (g, s) => {
  g.fillStyle = "#bdb6a8"; g.fillRect(0, 0, s, s);
  for (let i = 0; i < 6000; i++) { const v = 150 + rnd() * 70; g.fillStyle = `rgba(${v},${v - 5},${v - 15},0.4)`; g.fillRect(rnd() * s, rnd() * s, 2, 2); }
  g.fillStyle = "#4a4d50"; for (let k = 0; k < 4; k++) g.fillRect(20 + k * 60, 90, 34, 44);        // windows
}));
plaster.wrapS = plaster.wrapT = THREE.RepeatWrapping; plaster.colorSpace = THREE.SRGBColorSpace;
const wall = new THREE.MeshLambertMaterial({ map: plaster }), roof = new THREE.MeshLambertMaterial({ color: 0x5d5a55 });
const camoTex = new THREE.CanvasTexture(noiseCanvas(512, (g, s) => {       // painted camouflage seen on the stand (photos 2025-06-06)
  g.fillStyle = "#d9cfaa"; g.fillRect(0, 0, s, s);
  for (const [colr, n, r] of [["#3d7a45", 26, 70], ["#6e4b2f", 16, 55], ["#2c3a2a", 10, 40]]) {
    g.fillStyle = colr;
    for (let i = 0; i < n; i++) {
      const cx = rnd() * s, cy = rnd() * s; g.beginPath();
      for (let k = 0; k <= 10; k++) { const a = k / 10 * 6.283, rr = r * (0.5 + rnd()); g.lineTo(cx + Math.cos(a) * rr * 1.4, cy + Math.sin(a) * rr * 0.8); }
      g.fill();
    }

const sunDir = new THREE.Vector3();
function setHour(h, declDeg = -18.5) {                          // declDeg: sun declination (season), -18.5 = late autumn
  const decl = declDeg * Math.PI / 180, lat = 52.9 * Math.PI / 180, ha = (h - 11.8) * 15 * Math.PI / 180;
  const alt = Math.asin(Math.sin(lat) * Math.sin(decl) + Math.cos(lat) * Math.cos(decl) * Math.cos(ha));
  const az = Math.atan2(Math.sin(ha), Math.cos(ha) * Math.sin(lat) - Math.tan(decl) * Math.cos(lat)) + Math.PI;
  sunDir.set(Math.sin(az) * Math.cos(alt), Math.sin(alt), -Math.cos(az) * Math.cos(alt));
  sky.material.uniforms.sunPosition.value.copy(sunDir);
  const day = THREE.MathUtils.smoothstep(alt, -0.12, 0.15);
  const low = 1 - THREE.MathUtils.smoothstep(alt, 0.02, 0.35);
  sun.intensity = alt > 0 ? 3.2 * day : 0.25;                  // night: moonlight
  sun.color.setRGB(1, 0.92 - 0.3 * low, 0.82 - 0.45 * low);
  if (alt <= 0) sun.color.set(0x7d93c7);
  hemi.intensity = 0.04 + 1.0 * day;
  hemi.color.setRGB(0.8 * day + 0.15, 0.87 * day + 0.17, 1.0 * day + 0.3);
  renderer.toneMappingExposure = 0.55 + 1.2 * (1 - day);
  scene.fog.color.setRGB(0.72 * day + 0.03, 0.78 * day + 0.04, 0.85 * day + 0.08);
  sky.visible = alt > -0.2;
  scene.background = sky.visible ? null : new THREE.Color(0x05070d);
  document.getElementById("hourv").textContent = `${String(Math.floor(h)).padStart(2, "0")}:${String(Math.round(h % 1 * 60)).padStart(2, "0")}`;
}

  const rawDt = clock.getDelta(), dt = Math.min(rawDt, 0.1), sdt = Math.min(rawDt, 1.0);   // sdt: real time for the scripted scene
  timeU.value += dt;
  for (const m of mixers) m.update(window.__camOverride ? sdt : dt);
  if (window.__walker) {                      // walk back and forth between two points at ~1.4 m/s
    const w = window.__walker, A = w.path.a, B = w.path.b, L = Math.hypot(B[0] - A[0], B[1] - A[1]);
    w.path.t = (w.path.t + dt * 1.4 / L) % 2; const f = w.path.t < 1 ? w.path.t : 2 - w.path.t;
    const x = A[0] + (B[0] - A[0]) * f, z = A[1] + (B[1] - A[1]) * f;
    w.obj.position.set(x, hAt(x, z), z);
    w.obj.rotation.y = Math.atan2((B[0] - A[0]) * (w.path.t < 1 ? 1 : -1), (B[1] - A[1]) * (w.path.t < 1 ? 1 : -1));
  }
  for (const fl of flags) { const pa = fl.geometry.attributes.position; for (let i = 0; i < pa.count; i++) { const x = pa.getX(i) + 0.8; pa.setZ(i, Math.sin(timeU.value * (2 + windU.value * 0.4) - x * 3) * 0.08 * x * (0.3 + windU.value / 8)); } pa.needsUpdate = true; }
  for (const h of [...(window.__frameHooks || [])]) h(sdt);
  if (!window.__camOverride) camera.rotation.set(pitch, yaw, 0, "YXZ");
  if (mode === "fly" && !window.__camOverride) {
    const v = (keys.ShiftLeft ? 120 : 25) * dt, f = new THREE.Vector3(), r = new THREE.Vector3();
    camera.getWorldDirection(f); r.crossVectors(f, camera.up).normalize();
    if (keys.KeyW) camera.position.addScaledVector(f, v);
    if (keys.KeyS) camera.position.addScaledVector(f, -v);
    if (keys.KeyD) camera.position.addScaledVector(r, v);
    if (keys.KeyA) camera.position.addScaledVector(r, -v);
    if (keys.KeyE) camera.position.y += v;
    if (keys.KeyQ) camera.position.y -= v;
    camera.position.y = Math.max(camera.position.y, hAt(camera.position.x, camera.position.z) + 0.3);
  }
  if (grassCenter.distanceTo(cam2.set(camera.position.x, camera.position.z)) > 25) placeGrass(camera.position.x, camera.position.z);
  // the shadow map follows the camera in whole shadow texels (in the light's frame), so shadow edges do not crawl
  // and flicker while the camera moves
  { const L = (sunDir.y > 0 ? sunDir : new THREE.Vector3(0.3, 0.6, 0.4)).clone().normalize(), cam = sun.shadow.camera;
    const texel = (cam.right - cam.left) / sun.shadow.mapSize.x;
    const r = new THREE.Vector3().crossVectors(new THREE.Vector3(0, 1, 0), L).normalize(), u = new THREE.Vector3().crossVectors(L, r);
    const p = camera.position, a = Math.round(p.dot(r) / texel) * texel, b = Math.round(p.dot(u) / texel) * texel, c = p.dot(L);
    const snapped = r.multiplyScalar(a).add(u.multiplyScalar(b)).addScaledVector(L, c);
    sun.target.position.copy(snapped); sun.position.copy(snapped).addScaledVector(L, 1500); }
  info.textContent = `kierunek ${(((-yaw * 180 / Math.PI) % 360 + 360) % 360).toFixed(0)}°  powiększenie ${zoom.toFixed(1)}×`;
  if (window.__renderOverride) window.__renderOverride(); else renderer.render(scene, camera);
});
addEventListener("resize", () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
</script>
